<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
 html,body{margin:0;padding:0;width:1080px;height:1350px;overflow:hidden;background:#080D14;}
 body{position:relative;}
 #art{position:absolute;inset:0;width:1080px;height:1350px;}
 .brand{position:absolute;left:800px;top:80px;width:200px;height:80px;text-align:right;}
 .brand{background:linear-gradient(90deg,rgba(8,13,20,0) 0%,rgba(8,13,20,.72) 38%);border-radius:4px;padding-top:4px;box-sizing:border-box;}
 .cnt{font-family:"JetBrains Mono",monospace;font-size:24px;color:#7FA8C4;letter-spacing:.10em;}
 .pol{position:absolute;right:118px;top:6px;}
 .falloff{position:absolute;left:0;top:420px;width:1080px;height:930px;background:linear-gradient(180deg,rgba(8,13,20,0) 0%,rgba(8,13,20,.55) 20%,rgba(8,13,20,.93) 38%,#080D14 55%);}
 .goldrule{position:absolute;left:0;top:626px;width:1080px;height:5px;background:#FFC72C;}
 .tick{position:absolute;top:614px;width:3px;height:29px;background:#FFC72C;opacity:.30;}
 .head{position:absolute;left:80px;top:660px;width:920px;height:430px;
   font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-stretch:88%;
   color:#F4F8FF;line-height:1.00;letter-spacing:-.02em;}
 .foot{position:absolute;left:80px;top:1110px;width:920px;height:150px;}
 .kick{font-family:"JetBrains Mono",monospace;font-size:24px;color:#FFC72C;letter-spacing:.16em;}
 .ident{font-family:"Manrope",sans-serif;font-weight:700;font-size:30px;color:#E2A03F;margin-top:8px;}
 .src{font-family:"JetBrains Mono",monospace;font-size:24px;color:#8FA6B8;margin-top:10px;line-height:1.30;}
</style></head><body>
<canvas id="art" width="2160" height="2700" style="width:1080px;height:1350px;"></canvas>
<div class="falloff"></div>
<div class="goldrule"></div>
<div class="brand" data-zone="BRAND" data-knockout>
  <svg class="pol" width="20" height="20" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 1 L20.2 13.8 L33 17 L20.2 20.2 L17 33 L13.8 20.2 L1 17 L13.8 13.8 Z" fill="#FFC72C"/></svg>
  <div class="cnt">01 / 09</div>
</div>
<div class="head" id="head" data-zone="HEAD">8,000 dollars a month for somebody else to answer the phone.</div>
<div class="foot" data-zone="FOOTER">
  <div class="kick">CASE FILE NO. 002</div>
  <div class="ident">Akron Ohio. Founded 1958. 200 plus people in the group.</div>
  <div class="src">The 8,000 and the headcount are the owner's own figures, said on the podcast he co-hosts</div>
</div>
<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/aktype.js"></script>
<script src="@@ASSETS@@/js/akpost.js"></script>
<script type="module">
window.renderReady = (async () => {
  await document.fonts.ready;
  AK.reseed(20260815);
  // seven ticks on the threshold rule, unlit at state 1
  for (let i=0;i<7;i++){ const d=document.createElement('div'); d.className='tick';
    d.style.left = (150 + i*130) + 'px'; document.body.appendChild(d); }
  const cv = document.getElementById('art');
  let ok = false;
  try {
    const THREE = await import('@@ASSETS@@/js/three.module.min.js');
    const AKT = (await import('@@ASSETS@@/js/akthree.js')).init(THREE);
    if (AKT.webglOK()) {
      const R = AKT.setup(cv, {w:1080,h:1350,bg:0x080D14,fog:[0x0b1119,9,26],exposure:1.10});
      AKT.environment(R,{intensity:0.34});
      // the key light IS the desk lamp, so the pool and every shadow agree with it
      AKT.rig(R,{ key:{color:0xffd9a0,i:5.0,pos:[-1.30,1.72,-0.35],radius:1.3},
                  rim:{color:0x7FA8C4,i:1.5,pos:[5.2,2.2,-4.0]},
                  fill:{color:0x223046,i:0.34,pos:[3,1.6,5]},
                  ambient:{color:0x0e151f,i:0.6} });
      AKT.ground(R,{color:0x121b26,y:0,roughness:0.80});
      const g = new THREE.Group();
      // the bill, printed to a CanvasTexture so the desk lamp lights the figure
      const inv=document.createElement('canvas'); inv.width=560; inv.height=720;
      const ic=inv.getContext('2d');
      ic.fillStyle='#E8DDC2'; ic.fillRect(0,0,560,720);
      for(let i=0;i<11000;i++){ ic.fillStyle='rgba('+(Math.random()>.5?'120,105,80':'255,252,244')+','+(0.03+Math.random()*0.08)+')';
        ic.fillRect(Math.random()*560,Math.random()*720,1,1); }
      ic.fillStyle='#1A1712'; ic.fillRect(52,66,340,8);
      ic.font='700 27px monospace'; ic.fillStyle='#3A342B';
      ic.fillText('ANSWERING SERVICE', 52, 126);
      ic.strokeStyle='rgba(185,116,74,.40)'; ic.lineWidth=2;
      for(let y=182;y<=470;y+=52){ ic.beginPath(); ic.moveTo(52,y); ic.lineTo(508,y); ic.stroke(); }
      ic.font='400 23px monospace'; ic.fillStyle='#5A5348';
      ['AFTER HOURS','WEEKENDS','OVERFLOW'].forEach((s,i)=>ic.fillText(s,60,214+i*52));
      ic.textAlign='right';
      ['','',''].forEach(()=>{});
      ic.fillText('MONTHLY', 508, 370);
      ic.textAlign='left';
      ic.strokeStyle='#1A1712'; ic.lineWidth=3;
      ic.beginPath(); ic.moveTo(52,540); ic.lineTo(508,540); ic.stroke();
      ic.font='700 86px monospace'; ic.fillStyle='#1A1712';
      ic.textAlign='right'; ic.fillText('8,000', 508, 630);
      const invTex=new THREE.CanvasTexture(inv);
      invTex.anisotropy=4;
      const paper = new THREE.MeshStandardMaterial({map:invTex,roughness:0.94,metalness:0});
      const paperPlain = AKT.mat.clay(0xE8DDC2,{roughness:0.94});
      // the invoice, square to the desk, with one corner lifted and curling
      const sheet = new THREE.Mesh(new THREE.BoxGeometry(2.5,0.03,3.3), paper);
      sheet.position.set(-0.62,0.015,0.30); sheet.rotation.y=-0.16; g.add(sheet);
      const curl = new THREE.Mesh(new THREE.BoxGeometry(2.5,0.028,0.85), paperPlain);
      curl.position.set(-0.50,0.17,-1.28); curl.rotation.set(-0.46,-0.16,0); g.add(curl);
      // a second sheet under it, so the stack has thickness
      const under = new THREE.Mesh(new THREE.BoxGeometry(2.44,0.022,3.2), AKT.mat.clay(0xd6cbb0,{roughness:0.95}));
      under.position.set(-0.56,-0.008,0.36); under.rotation.y=-0.13; g.add(under);
      // the phone, base plus cradle plus handset, the object that rings
      const steel = AKT.mat.steel({roughness:0.34,metalness:0.86,color:0x30404f});
      const dark  = AKT.mat.plastic(0x1c2836,{roughness:0.40});
      const ph = new THREE.Group();
      const base = new THREE.Mesh(new THREE.BoxGeometry(1.95,0.34,1.30), steel);
      base.position.y=0.17; ph.add(base);
      for (const dx of [-0.62,0.62]) {
        const cr = new THREE.Mesh(new THREE.BoxGeometry(0.46,0.26,0.42), dark);
        cr.position.set(dx,0.47,0); ph.add(cr);
      }
      
      const dial = new THREE.Mesh(new THREE.CylinderGeometry(0.30,0.30,0.045,28), AKT.mat.steel({roughness:0.28,metalness:0.9,color:0x51616f}));
      dial.position.set(0.0,0.35,0.42); ph.add(dial);
      const hs2=new THREE.Group();
      const ear=new THREE.Mesh(new THREE.BoxGeometry(0.46,0.24,0.42), dark); ear.position.set(-0.66,0,0);
      const mou=new THREE.Mesh(new THREE.BoxGeometry(0.46,0.24,0.42), dark); mou.position.set(0.66,0,0);
      const bar=new THREE.Mesh(new THREE.BoxGeometry(1.10,0.17,0.26), dark);
      hs2.add(ear,mou,bar); hs2.position.set(0,0.86,-0.02); hs2.rotation.z=0.03; ph.add(hs2);
      ph.position.set(1.62,0,-0.10); ph.rotation.y=0.40; g.add(ph);
      // a mug, so the desk reads as somebody's desk
      const mug = new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.24,0.46,26), AKT.mat.clay(0x9c5f45,{roughness:0.7}));
      mug.position.set(-2.05,0.23,1.55); g.add(mug);
      // the lamp, shade low over the desk with the bulb beneath its opening
      const shade = new THREE.Mesh(new THREE.ConeGeometry(0.80,0.72,40,1,true),
        new THREE.MeshStandardMaterial({color:0x2c3946,roughness:0.40,metalness:0.72,side:THREE.DoubleSide}));
      shade.position.set(-1.30,1.98,-0.35); g.add(shade);
      const glow = new THREE.Mesh(new THREE.CylinderGeometry(0.74,0.74,0.03,32), AKT.mat.emissive(0xffe2b4,3.4));
      glow.position.set(-1.30,1.66,-0.35); g.add(glow);
      const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.16,18,14), AKT.mat.emissive(0xfff0d2,4.2));
      bulb.position.set(-1.30,1.76,-0.35); g.add(bulb);
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.042,0.042,1.85,12), steel);
      stem.position.set(-1.30,0.96,-0.92); stem.rotation.x=0.34; g.add(stem);
      const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.42,0.46,0.09,26), steel);
      foot.position.set(-1.30,0.045,-1.28); g.add(foot);
      AKT.add(R,g);
      g.scale.setScalar(0.92);
      AKT.frame(R,{from:[5.40,4.75,9.10],look:[-0.15,-1.55,-0.15],fov:33});
      const shot = await AKT.snapshot(R);
      ok = !!shot.ok;
    }
  } catch(e) { ok = false; }
  if (!ok) {
    // DESIGNED Canvas fallback, same crop and the same layout constants
    const cx = cv.getContext('2d'); cx.setTransform(1,0,0,1,0,0); cx.scale(2,2);
    const gsky = cx.createLinearGradient(0,0,0,1350);
    gsky.addColorStop(0,'#0b1420'); gsky.addColorStop(1,'#05080e');
    cx.fillStyle=gsky; cx.fillRect(0,0,1080,1350);
    const pool = cx.createRadialGradient(430,380,20,430,380,470);
    pool.addColorStop(0,'rgba(226,160,63,.42)'); pool.addColorStop(1,'rgba(226,160,63,0)');
    cx.fillStyle=pool; cx.fillRect(0,0,1080,900);
    cx.save(); cx.translate(360,470); cx.rotate(-0.06);
    cx.fillStyle='rgba(0,0,0,.45)'; cx.fillRect(-176,10,372,232);
    cx.fillStyle='#E8DDC2'; cx.fillRect(-186,0,372,232); cx.restore();
    cx.save(); cx.translate(700,440); cx.rotate(0.10);
    cx.fillStyle='rgba(0,0,0,.5)'; cx.fillRect(-118,16,250,96);
    cx.fillStyle='#2b3a49'; cx.fillRect(-126,0,250,96);
    cx.fillStyle='#111a24'; cx.fillRect(-118,-38,236,44); cx.restore();
    for (let i=0;i<2600;i++){ const x=AK.rng()()*1080, y=620+AK.rng()()*730;
      cx.fillStyle='rgba(127,168,196,'+(0.012+AK.rng()()*0.03)+')'; cx.fillRect(x,y,2,2); }
  }
  if (window.AKPOST) { try { AKPOST.grade(cv,{grain:0.045,bloom:0.22,dither:true}); } catch(e){} }
  AK.fitText(document.getElementById('head'),{min:88,max:150,maxLines:3});
  return true;
})();
</script></body></html>
