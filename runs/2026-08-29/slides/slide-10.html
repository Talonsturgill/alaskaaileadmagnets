<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="@@ASSETS@@/fonts/fonts.css">
<style>
  html, body { margin:0; padding:0; width:1080px; height:1350px; overflow:hidden; }
  body { background:#08111B; position:relative; font-kerning:normal; }
  #art { position:absolute; inset:0; }
  .layer { position:absolute; inset:0; }

  .kicker { position:absolute; left:80px; top:96px;
    font-family:"JetBrains Mono",monospace; font-weight:500; font-size:24px;
    letter-spacing:0.18em; color:#7E93AE; }
  .counter { position:absolute; left:880px; top:96px; width:120px; text-align:right;
    font-family:"JetBrains Mono",monospace; font-size:24px; color:#5C7086; }
  .pair { position:absolute; left:80px; top:140px; width:96px; height:44px; }

  .ask { position:absolute; left:80px; top:196px; width:880px; height:230px;
    font-family:"Bricolage Grotesque",sans-serif; font-weight:600;
    font-variation-settings:"wdth" 84; font-size:56px; line-height:1.06;
    letter-spacing:-0.014em; color:#F4F8FF; }

  .offer { position:absolute; left:80px; top:1030px; width:880px;
    font-family:"Manrope",sans-serif; font-weight:400; font-size:33px;
    line-height:1.40; color:#C6D4E2; }

  .brandrow { position:absolute; left:80px; top:1152px;
    display:flex; align-items:center; gap:18px; }
  .wordmark { font-family:"Bricolage Grotesque",sans-serif; font-weight:700;
    font-variation-settings:"wdth" 92; font-size:30px; letter-spacing:0.05em;
    color:#F4F8FF; }
  .site { font-family:"JetBrains Mono",monospace; font-weight:400; font-size:24px;
    letter-spacing:0.10em; color:#8FA6BE; }

  .srcnote { position:absolute; left:80px; top:1226px;
    font-family:"JetBrains Mono",monospace; font-weight:400; font-size:24px;
    letter-spacing:0.08em; color:#6F849B; }
</style>
</head>
<body>
  <canvas id="art" width="2160" height="2700" style="width:1080px;height:1350px;"></canvas>

  <div class="layer">
    <div class="kicker" data-zone="HEAD" data-block="kicker">CASE FILE NO. 002</div>
    <div class="counter" data-zone="FOOTER" data-block="kicker" data-decorative>10 / 10</div>

    <svg class="pair" viewBox="0 0 96 44" aria-hidden="true" data-decorative>
      <line x1="2" y1="12" x2="94" y2="12" stroke="#08111B" stroke-width="7"/>
      <line x1="2" y1="12" x2="94" y2="12" stroke="#F4F8FF" stroke-width="3.5"/>
      <!-- state 10: both conductors land in capped terminals; a third slot
           below sits EMPTY with a phantom-dash ring -->
      <circle cx="88" cy="12" r="5" fill="#F4F8FF"/>
      <line x1="2" y1="26" x2="80" y2="26" stroke="#2F6BB0" stroke-width="3.5"/>
      <circle cx="88" cy="26" r="5" fill="#2F6BB0"/>
      <circle cx="88" cy="40" r="5" fill="none" stroke="#7C8DA0" stroke-width="1.6"
              stroke-dasharray="3 2.4"/>
    </svg>

    <div class="ask" id="ask" data-zone="HEAD" data-block="ask">Milwaukee Magazine put the price at about one employee with benefits. La Crosse kept all four dispatchers.</div>

    <div class="offer" data-zone="BRAND" data-block="offer">We do this kind of analysis for Alaska businesses, free. If you want your operation looked at this way, say the word.</div>

    <div class="brandrow" data-zone="BRAND" data-block="brand">
      <img src="@@ASSETS@@/alaskaaipic.png" width="66" height="60" alt="Alaska.Ai">
      <div class="wordmark">ALASKA.AI</div>
      <div class="site">alaskaaihq.com</div>
    </div>

    <div class="srcnote" data-zone="FOOTER" data-block="srcnote">SOURCES IN COMMENTS</div>
  </div>

<script src="@@ASSETS@@/js/noise.js"></script>
<script src="@@ASSETS@@/js/aktype.js"></script>
<script src="@@ASSETS@@/js/akpost.js"></script>
<script type="module">
window.renderReady = new Promise(async (resolve) => {
  await document.fonts.ready;
  AK.reseed(20260829);

  const W = 1080, H = 1350;
  const cx = document.getElementById('art').getContext('2d');
  cx.scale(2, 2);

  /* the macro object lives in its DECLARED ART RECT, nowhere else */
  const ART = { x: 250, y: 452, w: 580, h: 560 };

  /* ---- ground ------------------------------------------------------------ */
  const g = cx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0A1420'); g.addColorStop(0.5, '#08111B'); g.addColorStop(1, '#060D16');
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  const b = cx.createRadialGradient(560, 700, 40, 560, 700, 560);
  b.addColorStop(0, 'rgba(232,163,61,0.11)'); b.addColorStop(1, 'rgba(232,163,61,0)');
  cx.fillStyle = b; cx.fillRect(0, 380, W, 700);

  /* ---- CANVAS-2D FALLBACK, designed, not improvised ---------------------- */
  /* Three terminal positions in gradient-solid relief (#43) with a long shadow
     (#48). Two capped, one empty with a phantom-dash ring. */
  function fallbackTerminals() {
    const cxm = ART.x + ART.w / 2;
    const ys = [ART.y + 110, ART.y + 280, ART.y + 450];
    // long shadow first
    cx.fillStyle = 'rgba(3,7,13,0.55)';
    cx.beginPath();
    cx.moveTo(cxm - 150, ys[2] + 60); cx.lineTo(cxm + 150, ys[2] + 60);
    cx.lineTo(cxm + 420, H); cx.lineTo(cxm - 60, H);
    cx.closePath(); cx.fill();

    ys.forEach((yy, i) => {
      const empty = (i === 2);
      // the block face the terminal sits in
      const fg = cx.createLinearGradient(0, yy - 56, 0, yy + 56);
      fg.addColorStop(0, '#22344A'); fg.addColorStop(1, '#101B27');
      cx.fillStyle = fg; cx.fillRect(cxm - 150, yy - 56, 300, 112);
      cx.strokeStyle = 'rgba(190,214,238,0.18)'; cx.lineWidth = 1.25;
      cx.strokeRect(cxm - 150, yy - 56, 300, 112);

      // two prongs
      cx.strokeStyle = empty ? 'rgba(124,141,160,0.55)' : '#9FB4C8'; cx.lineWidth = 3;
      for (const px of [cxm - 26, cxm + 26]) {
        cx.beginPath(); cx.moveTo(px, yy - 30); cx.lineTo(px, yy + 30); cx.stroke();
      }

      if (empty) {
        cx.save(); cx.setLineDash([8, 6]);
        cx.strokeStyle = 'rgba(160,182,206,0.62)'; cx.lineWidth = 2.4;
        cx.beginPath(); cx.arc(cxm, yy, 46, 0, Math.PI * 2); cx.stroke();
        cx.restore();
      } else {
        // the landed conductor and its chiselled cap
        cx.strokeStyle = '#05090F'; cx.lineWidth = 13;
        cx.beginPath(); cx.moveTo(cxm - 150, yy); cx.lineTo(cxm, yy); cx.stroke();
        cx.strokeStyle = i === 0 ? '#F4F8FF' : '#3E80C8'; cx.lineWidth = 6;
        cx.beginPath(); cx.moveTo(cxm - 150, yy); cx.lineTo(cxm, yy); cx.stroke();
        // cap: gradient solid with a hard specular
        const cg = cx.createRadialGradient(cxm - 12, yy - 12, 4, cxm, yy, 42);
        cg.addColorStop(0, '#E4EDF6'); cg.addColorStop(0.45, '#8FA6BE'); cg.addColorStop(1, '#3B4E64');
        cx.fillStyle = cg;
        cx.beginPath(); cx.arc(cxm, yy, 34, 0, Math.PI * 2); cx.fill();
        cx.fillStyle = 'rgba(255,255,255,0.55)';
        cx.beginPath(); cx.arc(cxm - 12, yy - 13, 6, 0, Math.PI * 2); cx.fill();
      }
    });

    // the gold Polaris sitting on the top cap
    const px = ART.x + ART.w / 2, py = ys[0] - 78;
    cx.fillStyle = '#FFC72C';
    cx.beginPath();
    cx.moveTo(px, py - 22); cx.lineTo(px + 6, py - 6); cx.lineTo(px + 22, py);
    cx.lineTo(px + 6, py + 6); cx.lineTo(px, py + 22); cx.lineTo(px - 6, py + 6);
    cx.lineTo(px - 22, py); cx.lineTo(px - 6, py - 6);
    cx.closePath(); cx.fill();
  }

  /* ---- akthree: THE DECK'S RENDERED-LADDER CLIMB ------------------------- */
  let usedGL = false;
  try {
    const THREE = await import('@@ASSETS@@/js/three.module.min.js');
    const mod = await import('@@ASSETS@@/js/akthree.js');
    const AKT = mod.init(THREE);

    if (AKT.webglOK()) {
      const off = document.createElement('canvas');
      off.width = ART.w * 2; off.height = ART.h * 2;
      const R = AKT.setup(off, { w: ART.w, h: ART.h, fov: 30, exposure: 1.06, bg: 0x07101A });
      AKT.environment(R, { intensity: 0.9 });
      AKT.rig(R, {
        key:  { color: 0xFFE4BC, i: 3.8, pos: [-3.2, 4.6, 5.4], radius: 7, shadowSize: 6 },
        rim:  { color: 0x5AC8F0, i: 1.5, pos: [4.6, 2.2, -3.8] },
        fill: { color: 0x2E4664, i: 0.8, pos: [3.4, 1.6, 5.2] },
        ambient: { color: 0x16222E, i: 1.3 }
      });

      const M = THREE.MeshStandardMaterial;
      const g3 = new THREE.Group();

      // the block the terminals are set into
      const block = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2.6, 0.5),
        new M({ color: 0x162434, metalness: 0.2, roughness: 0.62 }));
      block.position.set(0, 0, -0.3); g3.add(block);

      // three terminal positions: two capped, one empty
      for (let i = 0; i < 3; i++) {
        const yy = 0.82 - i * 0.82;
        const empty = (i === 2);
        // the recessed well
        const well = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.30, 0.12, 40),
          new M({ color: 0x0A131D, metalness: 0.1, roughness: 0.9 }));
        well.rotation.x = Math.PI / 2; well.position.set(0, yy, -0.02); g3.add(well);

        if (!empty) {
          // the landed conductor
          const wire = AKT.tube([[-1.5, yy, 0.10], [-0.5, yy, 0.12], [0, yy, 0.10]], 0.055,
            new M({ color: i === 0 ? 0xE8EEF6 : 0x3E80C8, metalness: 0.35, roughness: 0.42 }));
          g3.add(wire);
          // the chiselled cap: a lathe form, real metal
          const cap = AKT.lathe(
            [[0, 0], [0.26, 0], [0.30, 0.06], [0.28, 0.16], [0.16, 0.24], [0, 0.26]],
            new M({ color: 0xB9C9D8, metalness: 0.88, roughness: 0.26 }), { segments: 48 });
          cap.position.set(0, yy, 0.16); cap.rotation.x = -Math.PI / 2; g3.add(cap);
        }
      }
      AKT.add(R, g3);
      AKT.objectHero(R, g3, { toward: [-0.6, 0.5, -0.8], keyColor: 0xFFDA6E, intensity: 1.8 });
      // frame computed from the block's known 2.6 world height
      const FOV = 30, need = 3.15;
      const dist = need / (2 * Math.tan(FOV * Math.PI / 360));
      AKT.frame(R, { from: [dist * 0.16, dist * 0.10, dist * 0.98], look: [0, 0, 0], fov: FOV });

      const shot = await AKT.snapshot(R);
      if (shot && shot.ok) {
        cx.drawImage(off, ART.x, ART.y, ART.w, ART.h);
        usedGL = true;
      }
    }
  } catch (e) { usedGL = false; }

  if (!usedGL) fallbackTerminals();

  // the gold Polaris is DOM-adjacent brand geometry, drawn last so the grade
  // never shifts it away from brand-exact gold
  if (usedGL) {
    const px = ART.x + ART.w / 2, py = ART.y + 44;
    cx.fillStyle = '#FFC72C';
    cx.beginPath();
    cx.moveTo(px, py - 22); cx.lineTo(px + 6, py - 6); cx.lineTo(px + 22, py);
    cx.lineTo(px + 6, py + 6); cx.lineTo(px, py + 22); cx.lineTo(px - 6, py + 6);
    cx.lineTo(px - 22, py); cx.lineTo(px - 6, py - 6);
    cx.closePath(); cx.fill();
  }

  AKPOST.grade(cx, {
    w: W, h: H, exposure: -0.04, saturation: 1.06, contrast: 1.10, filmic: true,
    lift: [0.007, 0.011, 0.021], gain: [1.02, 1.0, 0.974], vignette: 0.30,
    bloom: { threshold: 0.70, strength: 0.34, radius: 9 },
    grain: { amount: 0.042, size: 2, seed: 20260829 },
    aberration: 0.4, dither: true, sharpen: 0.28
  });

  AK.fitText(document.getElementById('ask'), { min: 40, max: 58, maxLines: 4 });
  resolve();
});
</script>
</body>
</html>
